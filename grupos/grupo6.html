<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>⚽ Copa Quiz Premium</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#061a40,#1b6ca8,#2ecc71);
  color:white;
  text-align:center;
}

.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1518091043644-c1d4457512c6") center/cover;
  opacity:.15;
  z-index:-1;
}

h1{ margin-top:20px; }

input,select,button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
}

button{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

button:hover{transform:scale(1.05)}

.hidden{display:none}

#answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:20px;
}

.card{
  padding:15px;
  border-radius:15px;
  background:rgba(255,255,255,.15);
  cursor:pointer;
}

.card:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,.3);
}

#bar{
  height:10px;
  width:100%;
  background:lime;
  transition:1s linear;
  border-radius:5px;
}

.panel{
  margin:10px auto;
  width:90%;
  max-width:500px;
  padding:10px;
  background:rgba(0,0,0,.3);
  border-radius:15px;
}

.resultBox{
  background:rgba(0,0,0,.5);
  padding:20px;
  border-radius:20px;
  margin-top:20px;
}

.rank{
  text-align:left;
}
</style>
</head>

<body>

<div class="bg"></div>

<h1>⚽ Copa Quiz Premium 🏆</h1>

<!-- LOGIN -->
<div id="login" class="panel">
  <input id="name" placeholder="Seu nome">
  <button onclick="join()">Entrar</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">

  <div class="panel">
    ⏱ Timer:
    <select id="timer">
      <option value="5">5s</option>
      <option value="10" selected>10s</option>
      <option value="15">15s</option>
    </select>

    🎮 Perguntas:
    <input id="qtd" type="number" value="15" min="1" max="15">
  </div>

  <h2 id="question"></h2>

  <div id="answers"></div>

  <div id="bar"></div>

  <div class="panel">
    <button onclick="prev()">⏪ Voltar</button>
    <button onclick="togglePause()">⏸ / ▶</button>
    <button onclick="savePDF()">📄 PDF</button>
    <button onclick="exportJSON()">⬇ JSON</button>
  </div>

  <div id="result"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

/* =========================
   BANCO DE PERGUNTAS (15)
========================= */

const bank = [
  { q:"Qual país venceu a primeira Copa do Mundo da FIFA?",
    a:[{t:"Brasil",c:false},{t:"Alemanha",c:false},{t:"Uruguai",c:true},{t:"Argentina",c:false}] },

  { q:"Quantas Copas o Brasil ganhou?",
    a:[{t:"3",c:false},{t:"4",c:false},{t:"5",c:true},{t:"6",c:false}] },

  { q:"Em que ano o Brasil ganhou sua primeira Copa?",
    a:[{t:"1950",c:false},{t:"1954",c:false},{t:"1958",c:true},{t:"1962",c:false}] },

  { q:"Quem venceu a Copa 2022?",
    a:[{t:"França",c:false},{t:"Brasil",c:false},{t:"Argentina",c:true},{t:"Croácia",c:false}] },

  { q:"Quem é o Rei do Futebol?",
    a:[{t:"Neymar",c:false},{t:"Romário",c:false},{t:"Ronaldo",c:false},{t:"Pelé",c:true}] },

  { q:"Sede da Copa 2014?",
    a:[{t:"África do Sul",c:false},{t:"Brasil",c:true},{t:"Rússia",c:false},{t:"Alemanha",c:false}] },

  { q:"Brasil 7x1 foi contra quem?",
    a:[{t:"França",c:false},{t:"Alemanha",c:true},{t:"Argentina",c:false},{t:"Espanha",c:false}] },

  { q:"Jogadores por time?",
    a:[{t:"9",c:false},{t:"10",c:false},{t:"11",c:true},{t:"12",c:false}] },

  { q:"Copa 2022 foi onde?",
    a:[{t:"Japão",c:false},{t:"Catar",c:true},{t:"EUA",c:false},{t:"China",c:false}] },

  { q:"Mais Copas?",
    a:[{t:"Alemanha",c:false},{t:"Itália",c:false},{t:"Argentina",c:false},{t:"Brasil",c:true}] },

  { q:"Final 2002 quem marcou 2 gols?",
    a:[{t:"Ronaldinho",c:false},{t:"Rivaldo",c:false},{t:"Ronaldo",c:true},{t:"Cafu",c:false}] },

  { q:"Qual nunca ganhou Copa?",
    a:[{t:"Espanha",c:false},{t:"Inglaterra",c:false},{t:"Holanda",c:true},{t:"França",c:false}] },

  { q:"Primeira Copa foi em?",
    a:[{t:"1928",c:false},{t:"1930",c:true},{t:"1934",c:false},{t:"1940",c:false}] },

  { q:"Quem organiza a Copa?",
    a:[{t:"FIFA",c:true},{t:"UEFA",c:false},{t:"CONMEBOL",c:false},{t:"IOC",c:false}] },

  { q:"Outro país com 4 títulos?",
    a:[{t:"Alemanha",c:false},{t:"Itália",c:true},{t:"Argentina",c:false},{t:"França",c:false}] }
];

/* =========================
   VARIÁVEIS
========================= */

let player="";
let questions=[];
let index=0;
let score=0;
let paused=false;
let interval;

let ranking = JSON.parse(localStorage.getItem("ranking") || "{}");

/* =========================
   INÍCIO
========================= */

function join(){
  player=document.getElementById("name").value;
  if(!player) return;

  document.getElementById("login").style.display="none";
  document.getElementById("game").classList.remove("hidden");

  start();
}

function start(){
  const qtd=+document.getElementById("qtd").value;
  questions=bank.slice(0,qtd);

  index=0;
  score=0;
  show();
}

/* =========================
   MOSTRAR PERGUNTA
========================= */

function show(){
  if(index>=questions.length){
    finish();
    return;
  }

  const q=questions[index];
  document.getElementById("question").innerText=q.q;

  const box=document.getElementById("answers");
  box.innerHTML="";

  q.a.forEach(opt=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerText=opt.t;

    div.onclick=()=>{
      if(opt.c) score++;
      index++;
      show();
    };

    box.appendChild(div);
  });

  timer();
}

/* =========================
   TIMER
========================= */

function timer(){
  clearInterval(interval);

  let t=+document.getElementById("timer").value;
  let p=100;

  interval=setInterval(()=>{
    if(paused) return;

    p-=100/t;
    document.getElementById("bar").style.width=p+"%";

    if(p<=0){
      clearInterval(interval);
      index++;
      show();
    }
  },1000);
}

/* =========================
   CONTROLES
========================= */

function togglePause(){
  paused=!paused;
}

function prev(){
  if(index>0){
    index--;
    show();
  }
}

/* =========================
   FINAL
========================= */

function finish(){
  ranking[player]=score;
  localStorage.setItem("ranking",JSON.stringify(ranking));

  let arr=Object.entries(ranking).sort((a,b)=>b[1]-a[1]);

  document.getElementById("result").innerHTML=`
  <div class="resultBox">
    <h2>🏆 Resultado</h2>
    <p>${player}: ${score} pontos</p>

    <h3>Ranking</h3>
    <div class="rank">
      ${arr.map(p=>`⚽ ${p[0]} - ${p[1]}`).join("<br>")}
    </div>
  </div>`;
}

/* =========================
   PDF
========================= */

function savePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("Copa Quiz Premium",10,10);
  doc.text("Jogador: "+player,10,20);
  doc.text("Score: "+score,10,30);

  let y=50;
  Object.entries(ranking).forEach(p=>{
    doc.text(`${p[0]} - ${p[1]}`,10,y);
    y+=10;
  });

  doc.save("quiz.pdf");
}

/* =========================
   JSON EXPORT
========================= */

function exportJSON(){
  const data={
    title:"Copa Quiz Premium",
    total:bank.length,
    quiz:bank
  };

  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="quiz.json";
  a.click();

  URL.revokeObjectURL(url);
}

</script>

</body>
</html>

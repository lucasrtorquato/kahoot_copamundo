<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopaQuiz Premium - Estilo Kahoot</title>
    <style>
        /* Variáveis de Cores (Suporta Tema Claro e Escuro) */
        :root {
            --bg-body: #f1f2f6;
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #dcdde1;
            
            /* Cores clássicas do Kahoot */
            --kahoot-red: #e21b3c;
            --kahoot-blue: #1368ce;
            --kahoot-yellow: #d89e00;
            --kahoot-green: #26890c;
            
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            --bg-body: #1e272e;
            --bg-card: #2f3640;
            --text-main: #f5f6fa;
            --text-muted: #a4b0be;
            --border-color: #718093;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            padding: 20px;
        }

        /* Botão do Tema Escuro */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all var(--transition-speed);
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
        }

        /* Container Principal */
        .container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 850px;
            transition: background-color var(--transition-speed);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* Formulários e Inputs */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-body);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--kahoot-blue);
        }

        textarea {
            resize: vertical;
            height: 120px;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        /* Botões */
        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: var(--kahoot-blue);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #094b99;
            transition: all 0.1s;
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Grid de Respostas (Estilo Kahoot) */
        .game-section { display: none; }
        .result-section { display: none; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            font-weight: bold;
        }

        .question-box {
            background: var(--bg-body);
            padding: 30px;
            border-radius: 12px;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Feedback entre perguntas */
        .feedback-box {
            display: none;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            position: relative;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            height: 120px;
            cursor: pointer;
            padding: 20px 20px 20px 60px;
            text-align: left;
            display: flex;
            align-items: center;
            transition: transform 0.1s, filter 0.2s, opacity 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        /* Ícones Geométricos do Kahoot */
        .option-btn::before {
            position: absolute;
            left: 20px;
            font-size: 1.8rem;
            font-weight: 900;
        }

        .opt-0 { background-color: var(--kahoot-red); box-shadow: 0 6px 0 #b3102b; }
        .opt-0::before { content: "▲"; }
        
        .opt-1 { background-color: var(--kahoot-blue); box-shadow: 0 6px 0 #0d4fa1; }
        .opt-1::before { content: "◆"; }
        
        .opt-2 { background-color: var(--kahoot-yellow); box-shadow: 0 6px 0 #a67a00; }
        .opt-2::before { content: "●"; }
        
        .opt-3 { background-color: var(--kahoot-green); box-shadow: 0 6px 0 #1b6308; }
        .opt-3::before { content: "■"; }

        .option-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Estados do Feedback Visual nos Botões */
        .option-btn.correct-highlight {
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            transform: scale(1.02);
            z-index: 5;
        }

        .option-btn.wrong-dimmed {
            opacity: 0.25;
            filter: grayscale(60%);
            box-shadow: none;
        }

        /* Tela de Resultados */
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--kahoot-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        @media (max-width: 650px) {
            .options-grid { grid-template-columns: 1fr; }
            .row { grid-template-columns: 1fr; }
            .option-btn { height: 90px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">Modo Escuro</span>
    </button>

    <div class="container" id="setup-container">
        <h1>🏆 CopaQuiz Pro ⚽</h1>
        <p class="subtitle">Personalize sua partida estilo Kahoot</p>
        
        <div class="row">
            <div class="form-group">
                <label for="player-name">Apelido do Jogador</label>
                <input type="text" id="player-name" placeholder="Ex: GalvãoBueno94" required>
            </div>
            <div class="form-group">
                <label for="question-count">Nº de Perguntas (3-30)</label>
                <input type="number" id="question-count" min="3" max="30" value="10">
            </div>
        </div>

        <div class="form-group">
            <label for="custom-json">Importar perguntas em JSON (Opcional)</label>
            <textarea id="custom-json" placeholder='Deixe em branco para usar o padrão da Copa do Mundo ou cole aqui no formato:&#10;[&#10;  {"q": "Sua pergunta?", "options": ["Opção 0", "Opção 1", "Opção 2", "Opção 3"], "answer": 0}&#10;]'></textarea>
        </div>

        <button class="btn-primary" onclick="startGame()">Entrar no Jogo</button>
    </div>

    <div class="container game-section" id="game-container">
        <div class="game-header">
            <span id="player-display">👤 Jogador</span>
            <span id="progress-display">⏱️ Pergunta 1/10</span>
        </div>
        <div class="question-box" id="question-text">Carregando pergunta...</div>
        
        <div class="feedback-box" id="feedback-box"></div>

        <div class="options-grid" id="options-grid">
            </div>

        <button id="next-btn" class="btn-primary" style="display: none; margin-top: 25px; background-color: #2c3e50; box-shadow: 0 4px 0 #1a252f;" onclick="advanceQuestion()">Avançar ➡️</button>
    </div>

    <div class="container result-section" id="result-container">
        <h1>Fim da Partida! 🏁</h1>
        <p class="subtitle" id="final-message">Analisando sua performance...</p>
        <div class="score-circle" id="final-score">0/0</div>
        <button class="btn-primary" style="background-color: var(--kahoot-blue); box-shadow: 0 4px 0 #094b99;" onclick="location.reload()">Jogar Novamente</button>
    </div>

    <script>
        // Banco de dados Padrão (30 perguntas sobre a Copa do Mundo)
        const defaultQuestions = [
            {"q": "Qual país tem o maior número de títulos da Copa do Mundo?", "options": ["Alemanha", "Brasil", "Itália", "Argentina"], "answer": 1},
            {"q": "Em que ano foi realizada a primeira Copa do Mundo?", "options": ["1930", "1926", "1950", "1934"], "answer": 0},
            {"q": "Qual jogador é o maior artilheiro da história das Copas?", "options": ["Pelé", "Ronaldo Fenômeno", "Miroslav Klose", "Lionel Messi"], "answer": 2},
            {"q": "Qual país sediou a Copa do Mundo de 2010?", "options": ["África do Sul", "Brasil", "Alemanha", "Espanha"], "answer": 0},
            {"q": "Quem venceu a Copa do Mundo de 2022?", "options": ["França", "Croácia", "Brasil", "Argentina"], "answer": 3},
            {"q": "Qual dessas seleções nunca venceu uma Copa do Mundo?", "options": ["Espanha", "Holanda", "Uruguai", "Inglaterra"], "answer": 1},
            {"q": "Quem fez o famoso gol apelidado de 'A Mão de Deus'?", "options": ["Pelé", "Zidane", "Maradona", "Romário"], "answer": 2},
            {"q": "Qual animal foi a mascote da Copa de 2014 no Brasil?", "options": ["Tatu-bola", "Arara-azul", "Mico-leão-dourado", "Onça-pintada"], "answer": 0},
            {"q": "Qual foi o placar da final da Copa de 1998 entre França e Brasil?", "options": ["3 x 0", "2 x 1", "1 x 0", "2 x 0"], "answer": 0},
            {"q": "Quantas Copas o Pelé venceu como jogador?", "options": ["1", "2", "3", "4"], "answer": 2},
            {"q": "Qual o único goleiro a ganhar a Bola de Ouro em uma Copa?", "options": ["Buffon", "Oliver Kahn", "Casillas", "Neuer"], "answer": 1},
            {"q": "Qual país sediou a Copa de 1950?", "options": ["Uruguai", "Itália", "Brasil", "México"], "answer": 2},
            {"q": "Em 2018, qual país conquistou o bicampeonato mundial?", "options": ["Alemanha", "França", "Espanha", "Itália"], "answer": 1},
            {"q": "Quem marcou o gol do título da Espanha na Copa de 2010?", "options": ["Xavi", "David Villa", "Fernando Torres", "Andrés Iniesta"], "answer": 3},
            {"q": "Qual continentenunca sediou uma Copa do Mundo?", "options": ["América do Norte", "África", "Oceania", "Ásia"], "answer": 2},
            {"q": "Qual a taça original entregue aos vencedores até 1970?", "options": ["Taça FIFA", "Taça Jules Rimet", "Taça João Havelange", "Taça dos Campeões"], "answer": 1},
            {"q": "Onde ocorreu o infame 'Maracanazo'?", "options": ["Rio de Janeiro", "Buenos Aires", "Montevidéu", "São Paulo"], "answer": 0},
            {"q": "Qual é a seleção com mais vice-campeonatos?", "options": ["Alemanha", "Argentina", "Holanda", "Brasil"], "answer": 0},
            {"q": "Qual foi a primeira Copa com 32 seleções?", "options": ["1994 - EUA", "1998 - França", "2002 - Coreia/Japão", "2006 - Alemanha"], "answer": 1},
            {"q": "Quem foi o técnico da seleção brasileira no penta em 2002?", "options": ["Carlos Alberto Parreira", "Telê Santana", "Luiz Felipe Scolari", "Mário Zagallo"], "answer": 2},
            {"q": "O jogador Kylian Mbappé marcou quantos gols na final de 2022?", "options": ["1", "2", "3", "Nenhum"], "answer": 2},
            {"q": "Qual país participou de todas as edições de Copa do Mundo?", "options": ["Alemanha", "Itália", "Argentina", "Brasil"], "answer": 3},
            {"q": "Em 1994, quem errou o pênalti decisivo pela Itália contra o Brasil?", "options": ["Maldini", "Baggio", "Baresi", "Totti"], "answer": 1},
            {"q": "Quantos gols teve o jogo de maior placar da história (Áustria x Suíça, 1954)?", "options": ["10", "11", "12", "14"], "answer": 2},
            {"q": "Qual jogador aplicou uma cabeçada no adversário na final de 2006?", "options": ["Materazzi", "Pirlo", "Thierry Henry", "Zidane"], "answer": 3},
            {"q": "Em qual país aconteceu a primeira Copa do Mundo no Oriente Médio?", "options": ["Catar", "Emirados Árabes", "Arábia Saudita", "Irã"], "answer": 0},
            {"q": "De qual país é o jogador mais velho a marcar um gol em Copas (Roger Milla)?", "options": ["Camarões", "Nigéria", "África do Sul", "Gana"], "answer": 0},
            {"q": "Qual país da América Central chegou surpreendentemente às quartas em 2014?", "options": ["Honduras", "Costa Rica", "El Salvador", "Panamá"], "answer": 1},
            {"q": "Qual formato de bola foi introduzido pela Adidas na Copa de 1970?", "options": ["Telstar (Gomos pretos e brancos)", "Tango", "Fevernova", "Jabulani"], "answer": 0},
            {"q": "Qual é a música tema oficial da Copa de 2010 cantada por Shakira?", "options": ["We Are One", "Waka Waka", "La Copa de la Vida", "Live It Up"], "answer": 1}
        ];

        let activeQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let playerName = "";

        // Mecânica do Dark Mode
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-icon').innerText = newTheme === 'dark' ? '☀️' : '🌙';
            document.getElementById('theme-text').innerText = newTheme === 'dark' ? 'Modo Claro' : 'Modo Escuro';
        }

        // Inicialização do Jogo
        function startGame() {
            playerName = document.getElementById('player-name').value.trim();
            let countInput = parseInt(document.getElementById('question-count').value);
            const customJsonText = document.getElementById('custom-json').value.trim();

            if (!playerName) {
                alert("Por favor, digite seu apelido!");
                return;
            }

            if (isNaN(countInput) || countInput < 3 || countInput > 30) {
                alert("A quantidade de perguntas deve estar entre 3 e 30.");
                return;
            }

            let baseQuestions = [];
            if (customJsonText !== "") {
                try {
                    baseQuestions = JSON.parse(customJsonText);
                    if (!Array.isArray(baseQuestions) || baseQuestions.length < 3) {
                        throw new Error("O JSON precisa ser uma lista (array) com pelo menos 3 perguntas.");
                    }
                } catch (e) {
                    alert("Erro na leitura do seu JSON! Detalhe: " + e.message);
                    return;
                }
            } else {
                baseQuestions = [...defaultQuestions];
            }

            if (countInput > baseQuestions.length) {
                countInput = baseQuestions.length;
            }

            baseQuestions.sort(() => Math.random() - 0.5);
            activeQuestions = baseQuestions.slice(0, countInput);

            document.getElementById('setup-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('player-display').innerText = `👤 ${playerName}`;

            loadNextQuestion();
        }

        function loadNextQuestion() {
            // Resetar estados visuais de feedback
            document.getElementById('feedback-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            const currentQuestion = activeQuestions[currentIdx];
            
            document.getElementById('progress-display').innerText = `⏱️ Pergunta ${currentIdx + 1}/${activeQuestions.length}`;
            document.getElementById('question-text').innerText = currentQuestion.q;

            const grid = document.getElementById('options-grid');
            grid.innerHTML = ''; 

            currentQuestion.options.forEach((optText, index) => {
                const button = document.createElement('button');
                button.className = `option-btn opt-${index}`;
                button.innerText = optText;
                button.onclick = () => verifyChoice(index);
                grid.appendChild(button);
            });
        }

        function verifyChoice(chosenIndex) {
            const currentQuestion = activeQuestions[currentIdx];
            const correctAnswer = currentQuestion.answer;
            const buttons = document.querySelectorAll('.option-btn');
            const feedbackBox = document.getElementById('feedback-box');

            // 1. Desabilitar e estilizar todos os botões conforme o acerto/erro
            buttons.forEach((btn, index) => {
                btn.disabled = true; // Bloqueia cliques adicionais
                
                if (index === correctAnswer) {
                    btn.classList.add('correct-highlight'); // Destaca a certa
                } else {
                    btn.classList.add('wrong-dimmed'); // Ofusca as erradas
                }
            });

            // 2. Processar pontuação e exibir faixa informativa de feedback
            feedbackBox.style.display = 'block';
            if (chosenIndex === correctAnswer) {
                score++;
                feedbackBox.innerText = "🎉 Resposta Correta! Muito bem!";
                feedbackBox.style.backgroundColor = "rgba(38, 137, 12, 0.2)"; // Verde suave
                feedbackBox.style.color = "var(--kahoot-green)";
            } else {
                const correctText = currentQuestion.options[correctAnswer];
                feedbackBox.innerText = `❌ Resposta Incorreta! A resposta certa era: "${correctText}"`;
                feedbackBox.style.backgroundColor = "rgba(226, 27, 60, 0.2)"; // Vermelho suave
                feedbackBox.style.color = "var(--kahoot-red)";
            }

            // 3. Revelar o botão para passar adiante
            document.getElementById('next-btn').style.display = 'block';
        }

        function advanceQuestion() {
            currentIdx++;

            if (currentIdx < activeQuestions.length) {
                loadNextQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';

            const feedbackPct = (score / activeQuestions.length) * 100;
            let feedbackMsg = "";

            if (feedbackPct === 100) feedbackMsg = `Desempenho lendário, ${playerName}! Levantou a Taça! 🏆`;
            else if (feedbackPct >= 70) feedbackMsg = `Excelente, ${playerName}! Classificado em primeiro lugar! ⚽`;
            else if (feedbackPct >= 45) feedbackMsg = `Na média, ${playerName}. Passou raspando na fase de grupos. 👟`;
            else feedbackMsg = `Que eliminação dolorosa, ${playerName}... Precisa treinar mais tática. 😢`;

            document.getElementById('final-message').innerText = feedbackMsg;
            document.getElementById('final-score').innerText = `${score}/${activeQuestions.length}`;
        }
    </script>
</body>
</html>

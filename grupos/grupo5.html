<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Copa do Mundo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#009c3b,#fedf00);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#009c3b;
    margin-bottom:20px;
}

.screen{
    display:none;
}

.active{
    display:block;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.answer{
    border:none;
    padding:18px;
    border-radius:12px;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

.answer:hover{
    transform:scale(1.03);
}

.answer:nth-child(1){background:#e53935;}
.answer:nth-child(2){background:#1e88e5;}
.answer:nth-child(3){background:#43a047;}
.answer:nth-child(4){background:#fdd835;color:black;}

button{
    background:#009c3b;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

input[type=number]{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:2px solid #ddd;
    border-radius:10px;
}

.progress{
    margin-bottom:15px;
    font-weight:bold;
}

.score{
    text-align:center;
    font-size:28px;
    color:#009c3b;
}

input[type=file]{
    margin:15px 0;
}

@media(max-width:700px){
    .options{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

    <div id="startScreen" class="screen active">
        <h1>🏆 Quiz Copa do Mundo</h1>

        <label>Quantidade de perguntas:</label>
        <input type="number" id="questionCount" min="1" value="5">

        <label>Importar JSON:</label>
        <input type="file" id="jsonFile" accept=".json">

        <br><br>

        <button onclick="startQuiz()">Iniciar Quiz</button>
    </div>

    <div id="quizScreen" class="screen">
        <div class="progress" id="progress"></div>
        <h2 id="question"></h2>

        <div class="options" id="answers"></div>
    </div>

    <div id="resultScreen" class="screen">
        <h1>Fim de Jogo ⚽</h1>
        <p class="score" id="scoreText"></p>

        <br>

        <button onclick="location.reload()">
            Jogar Novamente
        </button>
    </div>

</div>

<script>

let questions = [
{
    question:"Qual país venceu a Copa do Mundo de 2002?",
    options:["Brasil","Alemanha","Argentina","França"],
    answer:0
},
{
    question:"Quantas Copas do Mundo o Brasil possui?",
    options:["3","4","5","6"],
    answer:2
},
{
    question:"Quem marcou dois gols na final de 2002?",
    options:["Ronaldinho","Rivaldo","Ronaldo","Kaká"],
    answer:2
},
{
    question:"Qual país sediou a Copa de 2014?",
    options:["Alemanha","Brasil","África do Sul","Rússia"],
    answer:1
},
{
    question:"Quem venceu a Copa de 2018?",
    options:["França","Croácia","Argentina","Alemanha"],
    answer:0
},
{
    question:"Qual seleção venceu a Copa de 2022?",
    options:["Argentina","Brasil","França","Portugal"],
    answer:0
},
{
    question:"Onde aconteceu a Copa de 2022?",
    options:["Rússia","Qatar","EUA","Japão"],
    answer:1
},
{
    question:"Qual jogador é conhecido como Rei do Futebol?",
    options:["Maradona","Pelé","Messi","Ronaldo"],
    answer:1
}
];

let quizQuestions = [];
let currentQuestion = 0;
let score = 0;

document
.getElementById("jsonFile")
.addEventListener("change", importJSON);

function importJSON(event){

    const file = event.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        try{

            const imported =
                JSON.parse(e.target.result);

            questions = imported;

            alert(
                imported.length +
                " perguntas carregadas!"
            );

        }catch{
            alert("JSON inválido!");
        }
    };

    reader.readAsText(file);
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [array[i],array[j]]=
        [array[j],array[i]];
    }

    return array;
}

function startQuiz(){

    const amount =
        parseInt(
            document.getElementById(
                "questionCount"
            ).value
        );

    quizQuestions =
        shuffle([...questions])
        .slice(0,amount);

    currentQuestion = 0;
    score = 0;

    showScreen("quizScreen");

    loadQuestion();
}

function loadQuestion(){

    const q =
        quizQuestions[currentQuestion];

    document.getElementById(
        "progress"
    ).textContent =
        `Pergunta ${currentQuestion+1}
         de ${quizQuestions.length}`;

    document.getElementById(
        "question"
    ).textContent =
        q.question;

    const answers =
        document.getElementById(
            "answers"
        );

    answers.innerHTML = "";

    q.options.forEach((option,index)=>{

        const btn =
            document.createElement(
                "button"
            );

        btn.className =
            "answer";

        btn.textContent =
            option;

        btn.onclick =
            ()=>checkAnswer(index);

        answers.appendChild(btn);
    });
}

function checkAnswer(index){

    const q =
        quizQuestions[currentQuestion];

    if(index===q.answer){
        score++;
    }

    currentQuestion++;

    if(
        currentQuestion <
        quizQuestions.length
    ){
        loadQuestion();
    }else{
        finishQuiz();
    }
}

function finishQuiz(){

    showScreen("resultScreen");

    document.getElementById(
        "scoreText"
    ).textContent =
        `${score} / ${quizQuestions.length}`;
}

function showScreen(id){

    document
    .querySelectorAll(".screen")
    .forEach(screen=>{
        screen.classList.remove(
            "active"
        );
    });

    document
    .getElementById(id)
    .classList.add("active");
}

</script>

</body>
</html>

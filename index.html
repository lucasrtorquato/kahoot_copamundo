<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kahoot Copa do Mundo 🏆</title>
  <style>
    :root {
      --pitch:  #1a472a;
      --turf:   #2a7a47;
      --gold:   #f0c040;
      --white:  #f5f7f0;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--pitch);
      background-image:
        repeating-linear-gradient(0deg,
          transparent, transparent 70px,
          rgba(255,255,255,.025) 70px, rgba(255,255,255,.025) 140px),
        repeating-linear-gradient(90deg,
          transparent, transparent 70px,
          rgba(255,255,255,.025) 70px, rgba(255,255,255,.025) 140px);
      color: var(--white);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
    }

    /* ── header ── */
    header { text-align: center; margin-bottom: 40px; }

    .trophy {
      font-size: 3.8rem;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px #f0c04077);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.6rem);
      font-weight: 900;
      letter-spacing: -.02em;
      line-height: 1.05;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--gold) 30%, #fffde0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 span {
      display: block;
      font-size: .48em;
      font-weight: 600;
      letter-spacing: .18em;
      color: rgba(245,247,240,.55);
      -webkit-text-fill-color: rgba(245,247,240,.55);
      margin-top: 6px;
    }

    hr {
      width: 100px; height: 2px; border: none;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 18px auto 0;
    }

    /* ── buttons ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      width: min(760px, 100%);
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 28px 16px 22px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--white);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* colored bottom bar per group */
    .btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: var(--accent, var(--gold));
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .btn:nth-child(1) { --accent: #e63946; }
    .btn:nth-child(2) { --accent: #4895ef; }
    .btn:nth-child(3) { --accent: #f4a261; }
    .btn:nth-child(4) { --accent: #2ec4b6; }
    .btn:nth-child(5) { --accent: #e76f51; }
    .btn:nth-child(6) { --accent: #a855f7; }
    .btn:nth-child(7) { --accent: #06d6a0; }

    .btn:hover, .btn:focus-visible {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 14px 36px rgba(0,0,0,.4), 0 0 0 2px var(--accent, var(--gold));
      border-color: var(--accent, var(--gold));
      outline: none;
    }

    .btn:active { transform: translateY(-2px) scale(1.01); }

    .num {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: 1;
      background: linear-gradient(150deg, var(--gold) 40%, #fffde0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
    }

    .ball { font-size: 1.4rem; }

    .label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(245,247,240,.55);
    }

    .cta {
      margin-top: 10px;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(240,192,64,.12);
      border: 1px solid rgba(240,192,64,.3);
      border-radius: 50px;
      padding: 5px 16px;
    }

    /* ── footer ── */
    footer {
      margin-top: 48px;
      font-size: .72rem;
      color: rgba(245,247,240,.25);
      letter-spacing: .08em;
      text-align: center;
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .num  { font-size: 3rem; }
      .btn  { padding: 20px 12px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <span class="trophy">🏆</span>
    <h1>
      Kahoot Copa do Mundo
      <span>Escolha o grupo da sua turma</span>
    </h1>
    <hr />
  </header>

  <div class="grid">

  </div>

  <footer>Copa do Mundo Escolar &nbsp;·&nbsp; Clique no número do seu grupo</footer>

</html>

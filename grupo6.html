<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>⚽ Copa Quiz Premium</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#061a40,#1b6ca8,#2ecc71);
  color:white;
  text-align:center;
}

.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1518091043644-c1d4457512c6") center/cover;
  opacity:.15;
  z-index:-1;
}

h1{
  margin-top:20px;
  animation:pop .8s ease;
}

@keyframes pop{
  from{transform:scale(.5)}
  to{transform:scale(1)}
}

input,select,button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
}

button{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

button:hover{transform:scale(1.05)}

.hidden{display:none}

#answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:20px;
}

.card{
  padding:15px;
  border-radius:15px;
  background:rgba(255,255,255,.15);
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,.3);
}

/* TIMER BAR */
#bar{
  height:10px;
  width:100%;
  background:lime;
  transition:1s linear;
  border-radius:5px;
}

/* PAINÉIS */
.panel{
  margin:10px auto;
  width:90%;
  max-width:500px;
  padding:10px;
  background:rgba(0,0,0,.3);
  border-radius:15px;
}

/* RESULTADO FINAL */
.resultBox{
  background:rgba(0,0,0,.5);
  padding:20px;
  border-radius:20px;
  margin-top:20px;
}

.rank{
  text-align:left;
}
</style>
</head>

<body>

<div class="bg"></div>

<h1>⚽ Copa Quiz Premium 🏆</h1>

<!-- LOGIN -->
<div id="login" class="panel">
  <input id="name" placeholder="Seu nome">
  <button onclick="join()">Entrar</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">

  <div class="panel">
    ⏱ Timer:
    <select id="timer">
      <option value="5">5s</option>
      <option value="10" selected>10s</option>
      <option value="15">15s</option>
    </select>

    🎮 Perguntas:
    <input id="qtd" type="number" value="5" min="1">
  </div>

  <h2 id="question"></h2>

  <div id="answers"></div>

  <div id="bar"></div>

  <div class="panel">
    <button onclick="prev()">⏪ Voltar</button>
    <button onclick="togglePause()">⏸ / ▶</button>
    <button onclick="savePDF()">📄 Salvar PDF</button>
  </div>

  <div id="result"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* =========================
   QUIZ PREMIUM FINAL
========================= */

let player="";
let questions=[];
let index=0;
let score=0;
let paused=false;
let interval;

let ranking = JSON.parse(localStorage.getItem("ranking") || "{}");

const bank=[
  {q:"Quem ganhou a Copa 2022?",a:[
    {t:"França",c:false},
    {t:"Argentina",c:true},
    {t:"Brasil",c:false},
    {t:"Alemanha",c:false}
  ]},
  {q:"Onde foi a Copa 2018?",a:[
    {t:"Brasil",c:false},
    {t:"Rússia",c:true},
    {t:"EUA",c:false},
    {t:"Portugal",c:false}
  ]},
  {q:"Quantos jogadores em campo?",a:[
    {t:"9",c:false},
    {t:"10",c:false},
    {t:"11",c:true},
    {t:"12",c:false}
  ]}
];

function join(){
  player=document.getElementById("name").value;
  if(!player) return;

  document.getElementById("login").style.display="none";
  document.getElementById("game").classList.remove("hidden");

  start();
}

function start(){
  const qtd=+document.getElementById("qtd").value;
  questions=bank.slice(0,qtd);

  index=0;
  score=0;

  show();
}

function show(){
  if(index>=questions.length){
    finish();
    return;
  }

  const q=questions[index];
  document.getElementById("question").innerText=q.q+" ⚽";

  const box=document.getElementById("answers");
  box.innerHTML="";

  q.a.forEach(opt=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerText=opt.t;

    div.onclick=()=>{
      if(opt.c) score++;
      index++;
      show();
    };

    box.appendChild(div);
  });

  timer();
}

function timer(){
  clearInterval(interval);

  let t=+document.getElementById("timer").value;
  let p=100;

  interval=setInterval(()=>{
    if(paused) return;

    p-=100/t;
    document.getElementById("bar").style.width=p+"%";

    if(p<=0){
      clearInterval(interval);
      index++;
      show();
    }
  },1000);
}

/* CONTROLES */
function togglePause(){
  paused=!paused;
}

function prev(){
  if(index>0){
    index--;
    show();
  }
}

/* FINAL + RANKING */
function finish(){
  ranking[player]=score;
  localStorage.setItem("ranking",JSON.stringify(ranking));

  let arr=Object.entries(ranking)
    .sort((a,b)=>b[1]-a[1]);

  document.getElementById("result").innerHTML=
  `
  <div class="resultBox">
    <h2>🏆 Resultado Final</h2>
    <p>${player}: ${score} pontos</p>

    <h3>📊 Ranking</h3>
    <div class="rank">
      ${arr.map(p=>`⚽ ${p[0]} - ${p[1]}`).join("<br>")}
    </div>
  </div>
  `;
}

/* 📄 PDF PROFISSIONAL */
function savePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.text("🏆 Copa Quiz Premium", 10, 10);

  doc.setFontSize(12);
  doc.text("Jogador: " + player, 10, 25);
  doc.text("Pontuação: " + score, 10, 35);
  doc.text("Perguntas respondidas: " + index, 10, 45);

  doc.text("Ranking Global:", 10, 60);

  let y=70;
  Object.entries(ranking)
    .sort((a,b)=>b[1]-a[1])
    .forEach(p=>{
      doc.text(`${p[0]} - ${p[1]}`,10,y);
      y+=10;
    });

  doc.save("copa-quiz-premium.pdf");
}
</script>

</body>
</html>
